# Local-development RouterOS client. The Docker Desktop subnet entry is needed
# because published UDP packets can be source-NATed before reaching FreeRADIUS.
client routeros_local {
    ipaddr = 10.10.10.1
    secret = $ENV{FREERADIUS_CLIENT_SECRET}
    shortname = routeros-local
    nastype = mikrotik
}

client docker_desktop_nat {
    ipaddr = 192.168.65.0/24
    secret = $ENV{FREERADIUS_CLIENT_SECRET}
    shortname = docker-desktop-nat
    nastype = mikrotik
}

client local_test {
    ipaddr = 127.0.0.1
    secret = $ENV{FREERADIUS_CLIENT_SECRET}
    shortname = local-test
}
