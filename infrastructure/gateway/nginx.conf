upstream crm_service { server crm-service:8000; }
upstream bss_service { server bss-service:8000; }
upstream oss_service { server oss-service:8000; }
upstream aaa_service { server aaa-service:8000; }
upstream nms_service { server nms-service:8000; }
upstream ipam_service { server ipam-service:8000; }
upstream siem_service { server siem-service:8000; }
upstream workforce_service { server workforce-service:8000; }
upstream warehouse_service { server warehouse-service:8000; }
upstream aiops_service { server aiops-service:8000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    location /api/v1/crm/ { proxy_pass http://crm_service/; }
    location /api/v1/bss/ { proxy_pass http://bss_service/; }
    location /api/v1/oss/ { proxy_pass http://oss_service/; }
    location /api/v1/aaa/ { proxy_pass http://aaa_service/; }
    location /api/v1/nms/ { proxy_pass http://nms_service/; }
    location /api/v1/ipam/ { proxy_pass http://ipam_service/; }
    location /api/v1/siem/ { proxy_pass http://siem_service/; }
    location /api/v1/workforce/ { proxy_pass http://workforce_service/; }
    location /api/v1/warehouse/ { proxy_pass http://warehouse_service/; }
    location /api/v1/aiops/ { proxy_pass http://aiops_service/; }

    # Compatibility cutovers. These retain the existing public path while the
    # destination service owns the implementation and database.
    location = /api/v1/customers { proxy_pass http://crm_service/customers; }
    location /api/v1/customers/ { proxy_pass http://crm_service/customers/; }
    location = /api/v1/plans { proxy_pass http://bss_service/plans; }
    location /api/v1/plans/ { proxy_pass http://bss_service/plans/; }
    location = /api/v1/billing/invoices { proxy_pass http://bss_service/invoices; }
    location = /api/v1/payments { proxy_pass http://bss_service/payments; }
    location /api/v1/subscribers/ { proxy_pass http://oss_service/subscribers/; }
    location = /api/v1/subscribers { proxy_pass http://oss_service/subscribers; }
    location /api/v1/orders/ { proxy_pass http://oss_service/orders/; }
    location = /api/v1/orders { proxy_pass http://oss_service/orders; }
    location = /internal/aaa/authenticate { proxy_pass http://aaa_service/authenticate; }
    location = /api/v1/auth/login { proxy_pass http://aaa_service/admin-login; }

    location / {
        default_type application/json;
        return 404 '{"detail":"No service owns this route"}';
    }
}
