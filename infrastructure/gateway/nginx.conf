upstream crm_service { server crm-service:8000; }
upstream oss_service { server oss-service:8000; }
upstream aaa_service { server aaa-service:8000; }
upstream identity_service { server identity-service:8000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    location /api/v1/crm/ { proxy_pass http://crm_service/api/crm/; }
    location /api/crm/ { proxy_pass http://crm_service/api/crm/; }
    location /api/v1/oss/ { proxy_pass http://oss_service/api/oss/; }
    location /api/oss/ { proxy_pass http://oss_service/api/oss/; }
    location /api/v1/aaa/ { proxy_pass http://aaa_service/; }
    # Public AAA management APIs. The private /internal/radius contract is
    # intentionally not proxied through the edge gateway.
    location /api/aaa/ { proxy_pass http://aaa_service/api/aaa/; }
    # Device management control plane (TR-069 CPE via GenieACS).
    # Tenancy control plane (multi-tenant + franchise management).
    # Assurance / observability governance surface. The internal ingest contract
    # (/internal/assurance/...) is not proxied through the edge gateway.
    # Intelligence / AI layer. Internal ingest (/internal/intelligence/...) is
    # not proxied through the edge gateway.

    # Compatibility cutovers. These retain the existing public path while the
    # destination service owns the implementation and database.
    location = /api/v1/customers { proxy_pass http://crm_service/customers; }
    location /api/v1/customers/ { proxy_pass http://crm_service/customers/; }
    location /api/v1/subscribers/ { proxy_pass http://oss_service/subscribers/; }
    location = /api/v1/subscribers { proxy_pass http://oss_service/subscribers; }
    location /api/v1/orders/ { proxy_pass http://oss_service/orders/; }
    location = /api/v1/orders { proxy_pass http://oss_service/orders; }
    location = /internal/aaa/authenticate { proxy_pass http://aaa_service/authenticate; }
    # Application-user auth lives in the dedicated identity-service (IAM).
    # AAA remains pure FreeRADIUS/NAS subscriber auth and never sees login tokens.
    location = /api/v1/auth/login { proxy_pass http://identity_service/admin-login; }
    location /api/auth/ { proxy_pass http://identity_service/api/auth/; }

    location / {
        default_type application/json;
        return 404 '{"detail":"No service owns this route"}';
    }
}
