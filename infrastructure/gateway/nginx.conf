# Docker can replace a service container without restarting this gateway. Use
# Docker's embedded DNS resolver so an upstream never keeps a stale address
# that has since been reassigned to a different service.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream crm_service { zone crm_service 64k; server crm-service:8000 resolve; }
upstream bss_service { zone bss_service 64k; server bss-service:8000 resolve; }
upstream oss_service { zone oss_service 64k; server oss-service:8000 resolve; }
upstream aaa_service { zone aaa_service 64k; server aaa-service:8000 resolve; }
upstream platform_core_service { zone platform_core_service 64k; server platform-core-service:8000 resolve; }
upstream nms_service { zone nms_service 64k; server nms-service:8000 resolve; }
upstream ipam_service { zone ipam_service 64k; server ipam-service:8000 resolve; }
upstream siem_service { zone siem_service 64k; server siem-service:8000 resolve; }
upstream workforce_service { zone workforce_service 64k; server workforce-service:8000 resolve; }
upstream warehouse_service { zone warehouse_service 64k; server warehouse-service:8000 resolve; }
upstream aiops_service { zone aiops_service 64k; server aiops-service:8000 resolve; }
upstream device_management_service { zone device_management_service 64k; server device-management-service:8000 resolve; }
upstream tenancy_service { zone tenancy_service 64k; server tenancy-service:8000 resolve; }
upstream assurance_service { zone assurance_service 64k; server assurance-service:8000 resolve; }
upstream intelligence_service { zone intelligence_service 64k; server intelligence-service:8000 resolve; }
upstream support_service { zone support_service 64k; server support-service:8000 resolve; }

# The browser application is hosted separately from the API gateway in local
# development and on the VPS. Reflect only known operator UI origins; never
# reflect arbitrary origins when credentials are allowed.
map $http_origin $cors_origin {
    default "";
    "~^http://localhost(:[0-9]+)?$" $http_origin;
    "~^http://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
    "http://187.127.141.214:3001" $http_origin;
}

map $http_x_correlation_id $support_id {
    default $request_id;
    "~^[A-Za-z0-9_.:-]{1,64}$" $http_x_correlation_id;
}

# Do not include query strings, credentials, request bodies or client IPs.
log_format isp_json escape=json '{"service":"gateway","correlation_id":"$support_id",'
    '"method":"$request_method","status":$status,"duration_seconds":$request_time,'
    '"upstream_status":"$upstream_status"}';

server {
    listen 80;
    server_name _;
    access_log /dev/stdout isp_json;
    proxy_set_header X-Correlation-ID $support_id;
    proxy_hide_header X-Correlation-ID;
    add_header X-Correlation-ID $support_id always;
    add_header Access-Control-Expose-Headers "X-Correlation-ID" always;
    client_max_body_size 12m;
    # Fine-grained operator permissions can produce an Authorization header
    # larger than Nginx's 8 KiB default. Keep enough headroom for the signed
    # access token without weakening request-body limits.
    client_header_buffer_size 16k;
    large_client_header_buffers 4 32k;

    # JWT signatures prove who originally received a token, but cannot reveal
    # that the account was disabled or its roles/scopes were changed later.
    # Revalidate operator sessions against Platform Core before forwarding any
    # edge API request. Public customer-portal and authentication routes opt
    # out below and continue using their own token domains.
    auth_request /_operator_session;
    location = /_operator_session {
        internal;
        proxy_pass http://platform_core_service/internal/auth/introspect;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Correlation-ID $support_id;
    }

    # Handle CORS preflight at the edge before a request reaches a FastAPI
    # route. FastAPI otherwise correctly responds 405 for OPTIONS on a POST or
    # PUT-only route, which browsers surface as a CORS error.
    if ($request_method = OPTIONS) {
        return 204;
    }

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-Correlation-ID, traceparent" always;
    add_header Access-Control-Max-Age 86400 always;
    add_header Vary "Origin" always;

    # The gateway owns the public CORS contract. Some upstream services also
    # emit these headers for direct development access; hide those values here
    # so browsers never receive duplicate Access-Control-* headers.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Max-Age;
    proxy_hide_header Vary;

    location /api/crm/portal/ { auth_request off; proxy_pass http://crm_service/api/crm/portal/; }
    location /api/oss/portal/ { auth_request off; proxy_pass http://oss_service/api/oss/portal/; }
    location /api/bss/portal/ { auth_request off; proxy_pass http://bss_service/api/bss/portal/; }
    location /api/support/portal/ { auth_request off; proxy_pass http://support_service/api/support/portal/; }

    location /api/v1/crm/ { proxy_pass http://crm_service/api/crm/; }
    location /api/crm/ { proxy_pass http://crm_service/api/crm/; }
    location /api/v1/bss/ { proxy_pass http://bss_service/api/bss/; }
    location /api/bss/ { proxy_pass http://bss_service/api/bss/; }
    location /api/v1/oss/ { proxy_pass http://oss_service/api/oss/; }
    location /api/oss/ { proxy_pass http://oss_service/api/oss/; }
    location /api/v1/aaa/ { proxy_pass http://aaa_service/; }
    # Public AAA management APIs. The private /internal/radius contract is
    # intentionally not proxied through the edge gateway.
    # Expose the canonical NAS orchestration API under the browser-safe AAA
    # namespace. These specific locations must precede the general AAA proxy.
    location /api/aaa/ { proxy_pass http://aaa_service/api/aaa/; }
location = /api/nas { proxy_pass http://aaa_service/api/nas; }
location /api/nas/ { proxy_pass http://aaa_service/api/nas/; }
    location /api/v1/nms/ { proxy_pass http://nms_service/api/nms/; }
    location /api/nms/ { proxy_pass http://nms_service/api/nms/; }
    location /api/v1/ipam/ { proxy_pass http://ipam_service/; }
    location /api/v1/siem/ { proxy_pass http://siem_service/api/siem/; }
    location /api/siem/ { proxy_pass http://siem_service/api/siem/; }
    location /api/v1/workforce/ { proxy_pass http://workforce_service/api/workforce/; }
    location /api/workforce/ { proxy_pass http://workforce_service/api/workforce/; }
    location /api/v1/warehouse/ { proxy_pass http://warehouse_service/api/warehouse/; }
    location /api/warehouse/ { proxy_pass http://warehouse_service/api/warehouse/; }
    location /api/v1/aiops/ { proxy_pass http://aiops_service/; }
    # Device management control plane (TR-069 CPE via GenieACS).
    location /api/v1/device-management/ { proxy_pass http://device_management_service/api/device-management/; }
    location /api/device-management/ { proxy_pass http://device_management_service/api/device-management/; }
    # Tenancy control plane (multi-tenant + franchise management).
    location /api/v1/tenancy/ { proxy_pass http://tenancy_service/api/tenancy/; }
    location /api/tenancy/ { proxy_pass http://tenancy_service/api/tenancy/; }
    # Assurance / observability governance surface. The internal ingest contract
    # (/internal/assurance/...) is not proxied through the edge gateway.
    location /api/v1/assurance/ { proxy_pass http://assurance_service/; }
    location /api/assurance/ { proxy_pass http://assurance_service/; }
    # Intelligence / AI layer. Internal ingest (/internal/intelligence/...) is
    # not proxied through the edge gateway.
    location /api/v1/intelligence/ { proxy_pass http://intelligence_service/; }
    location /api/intelligence/ { proxy_pass http://intelligence_service/; }
    location /api/support/ { proxy_pass http://support_service/api/support/; }

    # Compatibility cutovers. These retain the existing public path while the
    # destination service owns the implementation and database.
    location = /api/v1/customers { proxy_pass http://crm_service/customers; }
    location /api/v1/customers/ { proxy_pass http://crm_service/customers/; }
    location = /api/v1/plans { proxy_pass http://bss_service/plans; }
    location /api/v1/plans/ { proxy_pass http://bss_service/plans/; }
    location = /api/v1/billing/invoices { proxy_pass http://bss_service/invoices; }
    location /api/v1/billing/invoices/ { proxy_pass http://bss_service/invoices/; }
    location = /api/v1/billing/accounts { proxy_pass http://bss_service/billing/accounts; }
    location /api/v1/billing/accounts/ { proxy_pass http://bss_service/billing/accounts/; }
    location = /api/v1/payments { proxy_pass http://bss_service/payments; }
    location /api/v1/subscribers/ { proxy_pass http://oss_service/subscribers/; }
    location = /api/v1/subscribers { proxy_pass http://oss_service/subscribers; }
    # Backward-compatible order alias used by older web clients. The OSS
    # service owns the canonical /api/oss/orders route.
    location /api/v1/orders/ { proxy_pass http://oss_service/api/oss/orders/; }
    location = /api/v1/orders { proxy_pass http://oss_service/api/oss/orders; }
    location = /internal/aaa/authenticate { auth_request off; proxy_pass http://aaa_service/authenticate; }
    # Platform operators authenticate here; RADIUS remains a separate private domain.
    location /api/v1/auth/ { auth_request off; proxy_pass http://platform_core_service/api/v1/auth/; }
    location /api/v1/platform/ { proxy_pass http://platform_core_service/api/v1/platform/; }

    location / {
        default_type application/json;
        return 404 '{"detail":"No service owns this route"}';
    }
}
