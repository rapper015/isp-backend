route:
  group_by: ["severity", "team", "component"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "noc-dashboard"
  routes:
    - matchers:
        - severity = CRITICAL
      receiver: "noc-critical"
      continue: false
    - matchers:
        - team = SRE
      receiver: "sre"
      continue: false
    - matchers:
        - team = PLATFORM
      receiver: "platform"

receivers:
  - name: "noc-dashboard"
    webhook_configs:
      - url: http://assurance-service:8000/internal/assurance/v1/ingest/alert
        send_resolved: true
        http_config:
          headers:
            X-Internal-API-Key: ${ASSURANCE_INTERNAL_API_KEY:-change-me-internal-service-key}
  - name: "noc-critical"
    webhook_configs:
      - url: http://assurance-service:8000/internal/assurance/v1/ingest/alert
        send_resolved: true
  - name: "sre"
    webhook_configs:
      - url: http://assurance-service:8000/internal/assurance/v1/ingest/alert
        send_resolved: true
  - name: "platform"
    webhook_configs:
      - url: http://assurance-service:8000/internal/assurance/v1/ingest/alert
        send_resolved: true

inhibit_rules:
  - source_matchers: ["severity = CRITICAL"]
    target_matchers: ["severity =~ 'HIGH|MEDIUM'"]
    equal: ["team", "component"]
