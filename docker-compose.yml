name: isp-platform

x-domain-service: &domain-service
  build:
    context: .
    dockerfile: infrastructure/service.Dockerfile
  environment: &domain-environment
    RABBITMQ_URL: amqp://isp:isp@rabbitmq:5672/
    VALKEY_URL: redis://valkey:6379/0
    LOG_LEVEL: INFO
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    valkey:
      condition: service_healthy
  expose: ["8000"]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
    interval: 10s
    timeout: 3s
    retries: 10
  networks: [platform]

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-4000}:80"
    volumes:
      - ./infrastructure/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      crm-service:
        condition: service_healthy
      bss-service:
        condition: service_healthy
      oss-service:
        condition: service_healthy
      aaa-service:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      nms-service:
        condition: service_healthy
      workforce-service:
        condition: service_healthy
      device-management-service:
        condition: service_healthy
    networks: [edge, platform]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: isp
      POSTGRES_USER: isp
      POSTGRES_PASSWORD: isp
      POSTGRES_MULTIPLE_DATABASES: crm,bss,oss,aaa,identity,nms,workforce,device_management
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/create-service-databases.sh:/docker-entrypoint-initdb.d/create-service-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isp -d isp"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [platform]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: isp
      RABBITMQ_DEFAULT_PASS: isp
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform]

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [platform]

  crm-service:
    <<: *domain-service
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: crm-service}}
    environment: {<<: *domain-environment, SERVICE_NAME: crm-service, DATABASE_URL: postgresql://isp:isp@postgres:5432/crm}

  bss-service:
    <<: *domain-service
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: bss-service}}
    environment: {<<: *domain-environment, SERVICE_NAME: bss-service, DATABASE_URL: postgresql://isp:isp@postgres:5432/bss}

  oss-service:
    <<: *domain-service
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: oss-service}}
    environment: {<<: *domain-environment, SERVICE_NAME: oss-service, DATABASE_URL: postgresql://isp:isp@postgres:5432/oss}

  aaa-service:
    <<: *domain-service
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: aaa-service}}
    ports:
      - "${AAA_PORT:-8000}:8000"
    environment:
      <<: *domain-environment
      SERVICE_NAME: aaa-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/aaa
      AAA_INTERNAL_API_KEY: ${AAA_INTERNAL_API_KEY:-change-me-aaa-internal-key}
      AAA_ENCRYPTION_KEY: ${AAA_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      AAA_JWT_SECRET: ${AAA_JWT_SECRET:-change-me-aaa-jwt-secret-0123456789abcdef}
      AAA_INTERNAL_RATE_LIMIT: ${AAA_INTERNAL_RATE_LIMIT:-300}
      AAA_MANAGEMENT_RATE_LIMIT: ${AAA_MANAGEMENT_RATE_LIMIT:-120}
      AAA_REQUEST_MAX_BYTES: ${AAA_REQUEST_MAX_BYTES:-65536}
      AAA_AUTO_CREATE_SCHEMA: ${AAA_AUTO_CREATE_SCHEMA:-false}
      AAA_ENABLE_RADIUS_COMMANDS: ${AAA_ENABLE_RADIUS_COMMANDS:-false}
      AAA_ROUTEROS_ADAPTER: ${AAA_ROUTEROS_ADAPTER:-real}
      NAS_APPROVED_NETWORKS: ${NAS_APPROVED_NETWORKS:-10.0.0.0/8,192.168.0.0/16}
      NAS_ALLOW_HOSTNAMES: ${NAS_ALLOW_HOSTNAMES:-false}
      AAA_ALLOW_INSECURE_TLS: ${AAA_ALLOW_INSECURE_TLS:-false}
      AAA_SESSION_STALE_SECONDS: ${AAA_SESSION_STALE_SECONDS:-900}
      AAA_RADIUS_HEARTBEAT_SECONDS: ${AAA_RADIUS_HEARTBEAT_SECONDS:-120}
      AAA_OUTBOX_BATCH_SIZE: ${AAA_OUTBOX_BATCH_SIZE:-100}
      AAA_COMMAND_MAX_ATTEMPTS: ${AAA_COMMAND_MAX_ATTEMPTS:-3}
      AAA_WORKER_INTERVAL_SECONDS: ${AAA_WORKER_INTERVAL_SECONDS:-5}

  aaa-worker:
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: aaa-service}}
    command: ["python", "-m", "app.worker_runner"]
    environment:
      <<: *domain-environment
      SERVICE_NAME: aaa-worker
      DATABASE_URL: postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/aaa
      AAA_INTERNAL_API_KEY: ${AAA_INTERNAL_API_KEY:-change-me-aaa-internal-key}
      AAA_ENCRYPTION_KEY: ${AAA_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      AAA_JWT_SECRET: ${AAA_JWT_SECRET:-change-me-aaa-jwt-secret-0123456789abcdef}
      AAA_SESSION_STALE_SECONDS: ${AAA_SESSION_STALE_SECONDS:-900}
      AAA_RADIUS_HEARTBEAT_SECONDS: ${AAA_RADIUS_HEARTBEAT_SECONDS:-120}
      AAA_OUTBOX_BATCH_SIZE: ${AAA_OUTBOX_BATCH_SIZE:-100}
      AAA_COMMAND_MAX_ATTEMPTS: ${AAA_COMMAND_MAX_ATTEMPTS:-3}
      AAA_WORKER_INTERVAL_SECONDS: ${AAA_WORKER_INTERVAL_SECONDS:-5}
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      valkey: {condition: service_healthy}
    networks: [platform]

  identity-service:
    <<: *domain-service
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: identity-service}}
    environment:
      <<: *domain-environment
      SERVICE_NAME: identity-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/identity
      IDENTITY_JWT_SECRET: ${IDENTITY_JWT_SECRET:-change-me-identity-jwt-secret-0123456789abcdef}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:-change-me-platform-jwt-secret-0123456789abcdef}
      IDENTITY_TOKEN_TTL_SECONDS: ${IDENTITY_TOKEN_TTL_SECONDS:-43200}
      IDENTITY_INTERNAL_API_KEY: ${IDENTITY_INTERNAL_API_KEY:-change-me-identity-internal-key}
      IDENTITY_INTERNAL_API_KEYS: ${IDENTITY_INTERNAL_API_KEYS:-change-me-identity-internal-key}
      IDENTITY_BOOTSTRAP_ADMIN_USERNAME: ${IDENTITY_BOOTSTRAP_ADMIN_USERNAME:-admin}
      IDENTITY_BOOTSTRAP_ADMIN_PASSWORD: ${IDENTITY_BOOTSTRAP_ADMIN_PASSWORD:-change-me-admin-password}

  nms-service:
    <<: *domain-service
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: nms-service}}
    environment:
      <<: *domain-environment
      SERVICE_NAME: nms-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/nms
      NMS_JWT_SECRET: ${NMS_JWT_SECRET:-change-me-nms-jwt-secret-0123456789abcdef}
      NMS_INTERNAL_API_KEY: ${NMS_INTERNAL_API_KEY:-change-me-nms-internal-key}
      NMS_INTERNAL_API_KEYS: ${NMS_INTERNAL_API_KEY:-change-me-nms-internal-key}

  workforce-service:
    <<: *domain-service
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: workforce-service}}
    environment:
      <<: *domain-environment
      SERVICE_NAME: workforce-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/workforce
      WORKFORCE_JWT_SECRET: ${WORKFORCE_JWT_SECRET:-change-me-workforce-jwt-secret-0123456789abcdef}
      WORKFORCE_INTERNAL_API_KEY: ${WORKFORCE_INTERNAL_API_KEY:-change-me-workforce-internal-key}

  workforce-worker:
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: workforce-service}}
    command: ["python", "-m", "app.worker_runner"]
    environment:
      <<: *domain-environment
      SERVICE_NAME: workforce-worker
      DATABASE_URL: postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/workforce
      WORKFORCE_JWT_SECRET: ${WORKFORCE_JWT_SECRET:-change-me-workforce-jwt-secret-0123456789abcdef}
      WORKFORCE_INTERNAL_API_KEY: ${WORKFORCE_INTERNAL_API_KEY:-change-me-workforce-internal-key}
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      valkey: {condition: service_healthy}
    networks: [platform]

  device-management-service:
    <<: *domain-service
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: device-management-service}}
    environment: {<<: *domain-environment, SERVICE_NAME: device-management-service, DATABASE_URL: postgresql://isp:isp@postgres:5432/device_management, ACS_PROVIDER: genieacs, GENIEACS_BASE_URL: http://genieacs:7557, DEVICE_FIRMWARE_DIR: /data/firmware}
    volumes:
      - device-firmware:/data/firmware

  device-management-worker:
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: device-management-service}}
    command: ["python", "-m", "app.worker_runner"]
    environment: {<<: *domain-environment, SERVICE_NAME: device-management-worker, DATABASE_URL: postgresql://isp:isp@postgres:5432/device_management, ACS_PROVIDER: genieacs, GENIEACS_BASE_URL: http://genieacs:7557, DEVICE_FIRMWARE_DIR: /data/firmware}
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      valkey: {condition: service_healthy}
    networks: [platform]
    volumes:
      - device-firmware:/data/firmware

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    profiles: ["observability"]
    volumes:
      - ./infrastructure/observability/collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      prometheus: {condition: service_started}
      loki: {condition: service_started}
      tempo: {condition: service_started}
    expose: ["4317", "4318", "8889"]
    networks: [platform]

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/alert-rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    expose: ["9090"]
    networks: [platform]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["observability"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./infrastructure/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    expose: ["9093"]
    networks: [platform]

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks: [platform]

  loki:
    image: grafana/loki:3.1.1
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    expose: ["3100"]
    networks: [platform]

  tempo:
    image: grafana/tempo:2.5.0
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infrastructure/observability/tempo.yaml:/etc/tempo.yaml:ro
    expose: ["3200", "4317", "4318"]
    networks: [platform]

networks:
  edge:
  platform:
    internal: true

volumes:
  postgres-data:
  valkey-data:
  device-firmware:
  prometheus-data:
