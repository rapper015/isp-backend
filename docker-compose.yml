name: isp-platform

x-domain-service: &domain-service
  build:
    context: .
    dockerfile: infrastructure/service.Dockerfile
  environment: &domain-environment
    RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER in .env}:${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}@rabbitmq:5672/
    VALKEY_URL: redis://valkey:6379/0
    LOG_LEVEL: INFO
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    valkey:
      condition: service_healthy
  expose: ["8000"]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
    interval: 10s
    timeout: 3s
    retries: 10
  networks: [platform]

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-4000}:80"
    volumes:
      - ./infrastructure/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      crm-service:
        condition: service_healthy
      bss-service:
        condition: service_healthy
      oss-service:
        condition: service_healthy
      aaa-service:
        condition: service_healthy
      platform-core-service:
        condition: service_healthy
      nms-service:
        condition: service_healthy
      ipam-service:
        condition: service_healthy
      siem-service:
        condition: service_healthy
      workforce-service:
        condition: service_healthy
      warehouse-service:
        condition: service_healthy
      aiops-service:
        condition: service_healthy
      device-management-service:
        condition: service_healthy
      tenancy-service:
        condition: service_healthy
      assurance-service:
        condition: service_healthy
      intelligence-service:
        condition: service_healthy
      support-service:
        condition: service_healthy
    networks: [edge, platform]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: isp
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_MULTIPLE_DATABASES: crm,bss,oss,aaa,identity,nms,ipam,siem,workforce,warehouse,aiops,device_management,tenancy,assurance,intelligence,support
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/create-service-databases.sh:/docker-entrypoint-initdb.d/create-service-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER in .env} -d isp"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [platform]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform]

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [platform]

  crm-service:
    <<: *domain-service
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: crm-service}}
    environment:
      <<: *domain-environment
      SERVICE_NAME: crm-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/crm
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:?set PLATFORM_JWT_SECRET in .env}
      CUSTOMER_PORTAL_JWT_SECRET: ${CUSTOMER_PORTAL_JWT_SECRET:-${PLATFORM_JWT_SECRET}}
      CUSTOMER_PORTAL_ACCESS_MINUTES: ${CUSTOMER_PORTAL_ACCESS_MINUTES:-30}
      CRM_INTERNAL_API_KEY: ${CRM_INTERNAL_API_KEY:-change-me-crm-internal-key}
      CRM_INTERNAL_API_KEYS: ${CRM_INTERNAL_API_KEY:-change-me-crm-internal-key}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  support-service:
    <<: *domain-service
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: support-service}}
    environment:
      <<: *domain-environment
      SERVICE_NAME: support-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/support
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:?set PLATFORM_JWT_SECRET in .env}
      SUPPORT_CUSTOMER_JWT_SECRET: ${CUSTOMER_PORTAL_JWT_SECRET:-${PLATFORM_JWT_SECRET}}
      SUPPORT_INTERNAL_API_KEY: ${SUPPORT_INTERNAL_API_KEY:-change-me-support-internal-key}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  bss-service:
    <<: *domain-service
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: bss-service}}
    environment:
      <<: *domain-environment
      SERVICE_NAME: bss-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/bss
      BSS_JWT_SECRET: ${PLATFORM_JWT_SECRET:?set PLATFORM_JWT_SECRET in .env}
      CUSTOMER_PORTAL_JWT_SECRET: ${CUSTOMER_PORTAL_JWT_SECRET:-${PLATFORM_JWT_SECRET}}
      BSS_AAA_BASE_URL: http://aaa-service:8000
      BSS_AAA_INTERNAL_API_KEY: ${AAA_INTERNAL_API_KEY:?set AAA_INTERNAL_API_KEY in .env}
      BSS_CRM_BASE_URL: http://crm-service:8000
      BSS_CRM_INTERNAL_API_KEY: ${CRM_INTERNAL_API_KEY:-change-me-crm-internal-key}
      BSS_INTERNAL_API_KEY: ${BSS_INTERNAL_API_KEY:-local-development-bss-service-key-change-in-production}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  billing-scheduler:
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: bss-service}}
    command: ["sh", "-c", "alembic upgrade head && python -m app.scheduler"]
    environment:
      <<: *domain-environment
      SERVICE_NAME: billing-scheduler
      DATABASE_URL: postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/bss
      BSS_BILLING_INTERVAL_SECONDS: ${BSS_BILLING_INTERVAL_SECONDS:-300}
    depends_on:
      bss-service:
        condition: service_healthy
    networks: [platform]

  oss-service:
    <<: *domain-service
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: oss-service}}
    environment:
      <<: *domain-environment
      SERVICE_NAME: oss-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/oss
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:?set PLATFORM_JWT_SECRET in .env}
      CUSTOMER_PORTAL_JWT_SECRET: ${CUSTOMER_PORTAL_JWT_SECRET:-${PLATFORM_JWT_SECRET}}
      OSS_BSS_BASE_URL: http://bss-service:8000
      OSS_BSS_INTERNAL_API_KEY: ${BSS_INTERNAL_API_KEY:-local-development-bss-service-key-change-in-production}
      OSS_CRM_BASE_URL: http://crm-service:8000
      OSS_CRM_INTERNAL_API_KEY: ${CRM_INTERNAL_API_KEY:-change-me-crm-internal-key}
      OSS_AAA_BASE_URL: http://aaa-service:8000
      OSS_AAA_INTERNAL_API_KEY: ${AAA_INTERNAL_API_KEY:?set AAA_INTERNAL_API_KEY in .env}
      OSS_AAA_POLICY_ASSIGNMENT_MODE: live
      OSS_AAA_CREDENTIAL_MODE: live

  aaa-service:
    <<: *domain-service
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: aaa-service}}
    environment:
      <<: *domain-environment
      SERVICE_NAME: aaa-service
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/aaa
      AAA_INTERNAL_API_KEY: ${AAA_INTERNAL_API_KEY:?set AAA_INTERNAL_API_KEY in .env}
      AAA_ENCRYPTION_KEY: ${AAA_ENCRYPTION_KEY:?set AAA_ENCRYPTION_KEY in .env}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:?set PLATFORM_JWT_SECRET in .env}
      AAA_INTERNAL_RATE_LIMIT: ${AAA_INTERNAL_RATE_LIMIT:-300}
      AAA_MANAGEMENT_RATE_LIMIT: ${AAA_MANAGEMENT_RATE_LIMIT:-120}
      AAA_REQUEST_MAX_BYTES: ${AAA_REQUEST_MAX_BYTES:-65536}
      AAA_AUTO_CREATE_SCHEMA: ${AAA_AUTO_CREATE_SCHEMA:-false}
      AAA_ENABLE_RADIUS_COMMANDS: ${AAA_ENABLE_RADIUS_COMMANDS:-false}
      AAA_ROUTEROS_ADAPTER: ${AAA_ROUTEROS_ADAPTER:-real}
      NAS_APPROVED_NETWORKS: ${NAS_APPROVED_NETWORKS:-10.0.0.0/8,192.168.0.0/16}
      NAS_ALLOW_HOSTNAMES: ${NAS_ALLOW_HOSTNAMES:-false}
      AAA_ALLOW_INSECURE_TLS: ${AAA_ALLOW_INSECURE_TLS:-false}
      AAA_SESSION_STALE_SECONDS: ${AAA_SESSION_STALE_SECONDS:-900}
      AAA_RADIUS_HEARTBEAT_SECONDS: ${AAA_RADIUS_HEARTBEAT_SECONDS:-120}
      AAA_OUTBOX_BATCH_SIZE: ${AAA_OUTBOX_BATCH_SIZE:-100}
      AAA_COMMAND_MAX_ATTEMPTS: ${AAA_COMMAND_MAX_ATTEMPTS:-3}
      AAA_WORKER_INTERVAL_SECONDS: ${AAA_WORKER_INTERVAL_SECONDS:-5}
    networks: [platform, nas-management]

  aaa-worker:
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: aaa-service}}
    command: ["python", "-m", "app.worker_runner"]
    environment:
      <<: *domain-environment
      SERVICE_NAME: aaa-worker
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/aaa
      AAA_INTERNAL_API_KEY: ${AAA_INTERNAL_API_KEY:?set AAA_INTERNAL_API_KEY in .env}
      AAA_ENCRYPTION_KEY: ${AAA_ENCRYPTION_KEY:?set AAA_ENCRYPTION_KEY in .env}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:?set PLATFORM_JWT_SECRET in .env}
      AAA_SESSION_STALE_SECONDS: ${AAA_SESSION_STALE_SECONDS:-900}
      AAA_RADIUS_HEARTBEAT_SECONDS: ${AAA_RADIUS_HEARTBEAT_SECONDS:-120}
      AAA_OUTBOX_BATCH_SIZE: ${AAA_OUTBOX_BATCH_SIZE:-100}
      AAA_COMMAND_MAX_ATTEMPTS: ${AAA_COMMAND_MAX_ATTEMPTS:-3}
      AAA_WORKER_INTERVAL_SECONDS: ${AAA_WORKER_INTERVAL_SECONDS:-5}
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      valkey: {condition: service_healthy}
    networks: [platform, nas-management]

  freeradius:
    build:
      context: .
      dockerfile: infrastructure/freeradius/Dockerfile
    environment:
      AAA_BASE_URL: http://aaa-service:8000
      AAA_INTERNAL_API_KEY: ${AAA_INTERNAL_API_KEY:?set AAA_INTERNAL_API_KEY in .env}
      FREERADIUS_CLIENT_SECRET: ${FREERADIUS_CLIENT_SECRET:?set FREERADIUS_CLIENT_SECRET in .env}
    depends_on:
      aaa-service:
        condition: service_healthy
    ports:
      - "${RADIUS_BIND_ADDRESS:-0.0.0.0}:1812:1812/udp"
      - "${RADIUS_BIND_ADDRESS:-0.0.0.0}:1813:1813/udp"
    healthcheck:
      test: ["CMD", "/opt/sbin/radiusd", "-XC"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform, nas-management]

  platform-core-service:
    <<: *domain-service
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: platform-core-service}}
    environment:
      <<: *domain-environment
      SERVICE_NAME: platform-core-service
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/platform_core
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:?set PLATFORM_JWT_SECRET in .env}
      PLATFORM_BOOTSTRAP_ADMIN_USERNAME: ${PLATFORM_BOOTSTRAP_ADMIN_USERNAME:-admin}
      PLATFORM_BOOTSTRAP_ADMIN_PASSWORD: ${PLATFORM_BOOTSTRAP_ADMIN_PASSWORD:?set PLATFORM_BOOTSTRAP_ADMIN_PASSWORD in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

  nms-service:
    <<: *domain-service
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: nms-service}}
    environment:
      <<: *domain-environment
      SERVICE_NAME: nms-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/nms
      NMS_JWT_SECRET: ${NMS_JWT_SECRET:-change-me-nms-jwt-secret-0123456789abcdef}
      NMS_INTERNAL_API_KEY: ${NMS_INTERNAL_API_KEY:-change-me-nms-internal-key}
      NMS_INTERNAL_API_KEYS: ${NMS_INTERNAL_API_KEY:-change-me-nms-internal-key}

  ipam-service:
    <<: *domain-service
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: ipam-service}}
    environment: {<<: *domain-environment, SERVICE_NAME: ipam-service, DATABASE_URL: "postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/ipam"}

  siem-service:
    <<: *domain-service
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: siem-service}}
    environment:
      <<: *domain-environment
      SERVICE_NAME: siem-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/siem
      SIEM_JWT_SECRET: ${SIEM_JWT_SECRET:-change-me-siem-jwt-secret-0123456789abcdef}
      SIEM_INTERNAL_API_KEY: ${SIEM_INTERNAL_API_KEY:-change-me-siem-internal-key}
      SIEM_ENCRYPTION_KEY: ${SIEM_ENCRYPTION_KEY:-change-me-siem-encryption-key-0123456789abcdef}

  siem-worker:
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: siem-service}}
    command: ["python", "-m", "app.worker_runner"]
    environment:
      <<: *domain-environment
      SERVICE_NAME: siem-worker
      DATABASE_URL: postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/siem
      SIEM_JWT_SECRET: ${SIEM_JWT_SECRET:-change-me-siem-jwt-secret-0123456789abcdef}
      SIEM_INTERNAL_API_KEY: ${SIEM_INTERNAL_API_KEY:-change-me-siem-internal-key}
      SIEM_ENCRYPTION_KEY: ${SIEM_ENCRYPTION_KEY:-change-me-siem-encryption-key-0123456789abcdef}
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      valkey: {condition: service_healthy}
    networks: [platform]

  workforce-service:
    <<: *domain-service
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: workforce-service}}
    environment:
      <<: *domain-environment
      SERVICE_NAME: workforce-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/workforce
      WORKFORCE_JWT_SECRET: ${WORKFORCE_JWT_SECRET:-change-me-workforce-jwt-secret-0123456789abcdef}
      WORKFORCE_INTERNAL_API_KEY: ${WORKFORCE_INTERNAL_API_KEY:-change-me-workforce-internal-key}

  workforce-worker:
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: workforce-service}}
    command: ["python", "-m", "app.worker_runner"]
    environment:
      <<: *domain-environment
      SERVICE_NAME: workforce-worker
      DATABASE_URL: postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/workforce
      WORKFORCE_JWT_SECRET: ${WORKFORCE_JWT_SECRET:-change-me-workforce-jwt-secret-0123456789abcdef}
      WORKFORCE_INTERNAL_API_KEY: ${WORKFORCE_INTERNAL_API_KEY:-change-me-workforce-internal-key}
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      valkey: {condition: service_healthy}
    networks: [platform]

  warehouse-service:
    <<: *domain-service
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: warehouse-service}}
    environment:
      <<: *domain-environment
      SERVICE_NAME: warehouse-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/warehouse
      WAREHOUSE_JWT_SECRET: ${WAREHOUSE_JWT_SECRET:-change-me-warehouse-jwt-secret-0123456789abcdef}
      WAREHOUSE_INTERNAL_API_KEY: ${WAREHOUSE_INTERNAL_API_KEY:-change-me-warehouse-internal-key}
      WAREHOUSE_INTERNAL_API_KEYS: ${WAREHOUSE_INTERNAL_API_KEY:-change-me-warehouse-internal-key}

  aiops-service:
    <<: *domain-service
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: aiops-service}}
    environment: {<<: *domain-environment, SERVICE_NAME: aiops-service, DATABASE_URL: "postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/aiops"}

  device-management-service:
    <<: *domain-service
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: device-management-service}}
    environment: {<<: *domain-environment, SERVICE_NAME: device-management-service, DATABASE_URL: "postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/device_management", ACS_PROVIDER: genieacs, GENIEACS_BASE_URL: http://genieacs:7557, DEVICE_FIRMWARE_DIR: /data/firmware}
    volumes:
      - device-firmware:/data/firmware

  device-management-worker:
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: device-management-service}}
    command: ["python", "-m", "app.worker_runner"]
    environment: {<<: *domain-environment, SERVICE_NAME: device-management-worker, DATABASE_URL: "postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/device_management", ACS_PROVIDER: genieacs, GENIEACS_BASE_URL: http://genieacs:7557, DEVICE_FIRMWARE_DIR: /data/firmware}
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      valkey: {condition: service_healthy}
    networks: [platform]
    volumes:
      - device-firmware:/data/firmware

  tenancy-service:
    <<: *domain-service
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: tenancy-service}}
    environment:
      <<: *domain-environment
      SERVICE_NAME: tenancy-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/tenancy
      TENANCY_JWT_SECRET: ${PLATFORM_JWT_SECRET:?set PLATFORM_JWT_SECRET in .env}

  tenancy-worker:
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: tenancy-service}}
    command: ["python", "-m", "app.worker_runner"]
    environment:
      <<: *domain-environment
      SERVICE_NAME: tenancy-worker
      DATABASE_URL: postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/tenancy
      TENANCY_JWT_SECRET: ${PLATFORM_JWT_SECRET:?set PLATFORM_JWT_SECRET in .env}
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      valkey: {condition: service_healthy}
    networks: [platform]

  assurance-service:
    <<: *domain-service
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: assurance-service}}
    environment: {<<: *domain-environment, SERVICE_NAME: assurance-service, DATABASE_URL: "postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/assurance"}

  assurance-worker:
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: assurance-service}}
    command: ["python", "-m", "app.worker_runner"]
    environment: {<<: *domain-environment, SERVICE_NAME: assurance-worker, DATABASE_URL: "postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/assurance"}
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      valkey: {condition: service_healthy}
    networks: [platform]

  intelligence-service:
    <<: *domain-service
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: intelligence-service}}
    environment:
      <<: *domain-environment
      SERVICE_NAME: intelligence-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/intelligence
      REDIS_URL: redis://valkey:6379/0
      INTELLIGENCE_JWT_SECRET: ${INTELLIGENCE_JWT_SECRET:-change-me-intelligence-jwt-secret-0123456789abcdef}
      INTELLIGENCE_INTERNAL_API_KEY: ${INTELLIGENCE_INTERNAL_API_KEY:-change-me-intelligence-internal-key}
      INTELLIGENCE_RATE_LIMIT: ${INTELLIGENCE_RATE_LIMIT:-120}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_JSON: ${LOG_JSON:-true}

  intelligence-worker:
    build: {context: ., dockerfile: infrastructure/service.Dockerfile, args: {SERVICE_DIRECTORY: intelligence-service}}
    command: ["python", "-m", "app.worker_runner"]
    environment:
      <<: *domain-environment
      SERVICE_NAME: intelligence-worker
      DATABASE_URL: postgresql://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp}@postgres:5432/intelligence
      REDIS_URL: redis://valkey:6379/0
      INTELLIGENCE_JWT_SECRET: ${INTELLIGENCE_JWT_SECRET:-change-me-intelligence-jwt-secret-0123456789abcdef}
      INTELLIGENCE_INTERNAL_API_KEY: ${INTELLIGENCE_INTERNAL_API_KEY:-change-me-intelligence-internal-key}
      INTELLIGENCE_RATE_LIMIT: ${INTELLIGENCE_RATE_LIMIT:-120}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_JSON: ${LOG_JSON:-true}
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      valkey: {condition: service_healthy}
    networks: [platform]

  # ---- Optional observability stack (start with --profile observability) ----
  # The assurance-service is the governance layer; metrics/logs/traces are stored
  # by these components via the OpenTelemetry Collector (config under
  # infrastructure/observability/).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    profiles: ["observability"]
    volumes:
      - ./infrastructure/observability/collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      prometheus: {condition: service_started}
      loki: {condition: service_started}
      tempo: {condition: service_started}
    expose: ["4317", "4318", "8889"]
    networks: [platform]

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/alert-rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    expose: ["9090"]
    networks: [platform]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["observability"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./infrastructure/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    expose: ["9093"]
    networks: [platform]

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks: [platform]

  loki:
    image: grafana/loki:3.1.1
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    expose: ["3100"]
    networks: [platform]

  tempo:
    image: grafana/tempo:2.5.0
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infrastructure/observability/tempo.yaml:/etc/tempo.yaml:ro
    expose: ["3200", "4317", "4318"]
    networks: [platform]

networks:
  edge:
  nas-management:
  platform:
    internal: true

volumes:
  postgres-data:
  valkey-data:
  device-firmware:
  prometheus-data:
